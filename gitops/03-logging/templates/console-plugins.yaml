{{- if .Values.uiPlugin.enabled }}
# Patch Console to enable logging-view-plugin
# This enables the Logs UI under Observe > Logs
apiVersion: operator.openshift.io/v1
kind: Console
metadata:
  name: cluster
  annotations:
    # Use merge strategy to add plugin without removing existing ones
    argocd.argoproj.io/sync-options: ServerSideApply=true
spec:
  plugins:
    - logging-view-plugin
    - gitops-plugin
    - monitoring-plugin
    - networking-console-plugin
{{- end }}

