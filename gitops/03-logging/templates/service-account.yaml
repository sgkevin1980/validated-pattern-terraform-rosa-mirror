# Service Account for ClusterLogForwarder (required in Logging 6.x)
# Reference: https://docs.openshift.com/container-platform/latest/observability/logging/log_collection_forwarding/cluster-logging-collector.html
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.clusterLogForwarder.serviceAccount.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: cluster-log-forwarder
    app.kubernetes.io/part-of: logging-stack
---
# ClusterRole for log collection
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-logging-collector
  labels:
    app.kubernetes.io/name: cluster-log-forwarder
    app.kubernetes.io/part-of: logging-stack
rules:
  # Permissions for collecting application logs
  - apiGroups:
      - ""
    resources:
      - namespaces
      - pods
    verbs:
      - get
      - list
      - watch
  # Permissions for collecting infrastructure and audit logs
  - apiGroups:
      - security.openshift.io
    resources:
      - securitycontextconstraints
    resourceNames:
      - privileged
    verbs:
      - use
---
# ClusterRoleBinding for the collector service account
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-logging-collector
  labels:
    app.kubernetes.io/name: cluster-log-forwarder
    app.kubernetes.io/part-of: logging-stack
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-logging-collector
subjects:
  - kind: ServiceAccount
    name: {{ .Values.clusterLogForwarder.serviceAccount.name }}
    namespace: {{ .Values.namespace }}
---
# Roles for COLLECTING logs (required for log collection permission)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-logging-collector-collect-app-logs
  labels:
    app.kubernetes.io/name: cluster-log-forwarder
    app.kubernetes.io/part-of: logging-stack
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: collect-application-logs
subjects:
  - kind: ServiceAccount
    name: {{ .Values.clusterLogForwarder.serviceAccount.name }}
    namespace: {{ .Values.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-logging-collector-collect-infra-logs
  labels:
    app.kubernetes.io/name: cluster-log-forwarder
    app.kubernetes.io/part-of: logging-stack
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: collect-infrastructure-logs
subjects:
  - kind: ServiceAccount
    name: {{ .Values.clusterLogForwarder.serviceAccount.name }}
    namespace: {{ .Values.namespace }}
---
# Roles for WRITING to LokiStack
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-logging-collector-logs-writer
  labels:
    app.kubernetes.io/name: cluster-log-forwarder
    app.kubernetes.io/part-of: logging-stack
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: logging-collector-logs-writer
subjects:
  - kind: ServiceAccount
    name: {{ .Values.clusterLogForwarder.serviceAccount.name }}
    namespace: {{ .Values.namespace }}

