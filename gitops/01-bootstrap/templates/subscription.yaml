{{- if not .Values.loki.enabled }}
# Subscription for OpenShift GitOps Operator
# Only created in first release (when loki.enabled=false)
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: openshift-gitops-operator
  namespace: {{ .Values.operator.namespace }}
spec:
  channel: {{ .Values.operator.channel }}
  installPlanApproval: {{ .Values.operator.installPlanApproval }}
  name: openshift-gitops-operator
  source: {{ .Values.operator.source }}
  sourceNamespace: openshift-marketplace
{{- end }}
